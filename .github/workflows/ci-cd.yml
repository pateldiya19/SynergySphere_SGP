name: SGP CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sgp-production-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_BRANCH: main
      REPOSITORY_SSH_URL: git@github.com:${{ github.repository }}.git
    steps:
      - name: Load EC2 SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: |
          set -Eeuo pipefail
          test -n "$EC2_HOST"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy release and health-check
        run: |
          set -Eeuo pipefail
          test -n "$EC2_USER"
          test -n "$EC2_APP_DIR"
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=yes"
          ssh "$EC2_USER@$EC2_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' DEPLOY_BRANCH='$DEPLOY_BRANCH' EC2_APP_DIR='$EC2_APP_DIR' REPOSITORY_SSH_URL='$REPOSITORY_SSH_URL' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 077

          : "${DEPLOY_SHA:?DEPLOY_SHA is required}"
          : "${DEPLOY_BRANCH:?DEPLOY_BRANCH is required}"
          : "${EC2_APP_DIR:?EC2_APP_DIR is required}"
          : "${REPOSITORY_SSH_URL:?REPOSITORY_SSH_URL is required}"

          RELEASES_DIR="$EC2_APP_DIR/releases"
          SHARED_DIR="$EC2_APP_DIR/shared"
          CURRENT_LINK="$EC2_APP_DIR/current"
          LOCK_FILE="$EC2_APP_DIR/deploy.lock"
          RELEASE_DIR="$RELEASES_DIR/$DEPLOY_SHA"
          SHARED_ENV="$SHARED_DIR/backend.env"
          PREVIOUS_RELEASE=""
          DEPLOY_PROMOTED=0

          mkdir -p "$RELEASES_DIR" "$SHARED_DIR"
          if [ -L "$CURRENT_LINK" ]; then
            PREVIOUS_RELEASE="$(readlink -f "$CURRENT_LINK")"
          fi

          exec 9>"$LOCK_FILE"
          if ! flock -n 9; then
            echo "Another SGP deployment is already running." >&2
            exit 1
          fi

          if [ ! -f "$SHARED_ENV" ]; then
            echo "Missing $SHARED_ENV. Create the server environment file before deploying." >&2
            exit 1
          fi

          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$DEPLOY_PROMOTED" -eq 1 ] && [ -n "$PREVIOUS_RELEASE" ] && [ -f "$PREVIOUS_RELEASE/backend/docker-compose.yml" ]; then
              echo "Deployment failed; restoring previous release: $PREVIOUS_RELEASE"
              ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"
              docker compose --project-name synergysphere --env-file "$PREVIOUS_RELEASE/backend/.env" -f "$PREVIOUS_RELEASE/backend/docker-compose.yml" up -d --remove-orphans
              echo "Rollback containers started from the previous release."
            fi
            exit "$status"
          }
          trap rollback EXIT

          if [ ! -d "$RELEASE_DIR/.git" ]; then
            git clone --no-checkout --filter=blob:none --depth 1 --branch "$DEPLOY_BRANCH" "$REPOSITORY_SSH_URL" "$RELEASE_DIR"
          fi
          git -C "$RELEASE_DIR" fetch --quiet origin "$DEPLOY_BRANCH"
          git -C "$RELEASE_DIR" checkout --quiet --detach "$DEPLOY_SHA"

          ACTUAL_SHA="$(git -C "$RELEASE_DIR" rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "Checked-out commit $ACTUAL_SHA does not match requested commit $DEPLOY_SHA." >&2
            exit 1
          fi

          ln -sfn "$SHARED_ENV" "$RELEASE_DIR/backend/.env"
          COMPOSE_FILE="$RELEASE_DIR/backend/docker-compose.yml"
          COMPOSE_ARGS=(--project-name synergysphere --env-file "$RELEASE_DIR/backend/.env" -f "$COMPOSE_FILE")

          echo "Building release $DEPLOY_SHA"
          docker compose "${COMPOSE_ARGS[@]}" build --pull
          DEPLOY_PROMOTED=1
          echo "Starting release $DEPLOY_SHA"
          docker compose "${COMPOSE_ARGS[@]}" up -d --remove-orphans
          ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

          echo "Waiting for backend health"
          healthy=0
          for attempt in $(seq 1 30); do
            if docker compose "${COMPOSE_ARGS[@]}" exec -T backend node -e "require('http').get('http://127.0.0.1:5000/api/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Backend health check failed." >&2
            exit 1
          fi

          echo "Checking frontend availability"
          docker compose "${COMPOSE_ARGS[@]}" exec -T frontend wget -q -O - http://127.0.0.1/ >/dev/null
          echo "Deployment $DEPLOY_SHA is healthy."
          trap - EXIT
          REMOTE_SCRIPT
